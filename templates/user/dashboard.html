{{define "content"}}
<div class="page-head">
  <div>
    <h1>Welcome back!</h1>
    <p>Submit your jobs and track their progress.</p>
  </div>
  <a href="/user/submit-job" class="btn">+ Submit Job Request</a>
</div>

<div class="stats" id="job-stats" aria-live="polite">
  <div class="stat"><span>Total Jobs</span><strong id="total-jobs">—</strong></div>
  <div class="stat queued"><span>Queued</span><strong id="queued-jobs">—</strong></div>
  <div class="stat processing"><span>Processing</span><strong id="processing-jobs">—</strong></div>
  <div class="stat completed"><span>Completed</span><strong id="completed-jobs">—</strong></div>
  <div class="stat failed"><span>Failed</span><strong id="failed-jobs">—</strong></div>
</div>

<div class="panel">
  <h3>Recent Jobs</h3>
  <p id="jobs-message" class="empty-note" role="status">Loading jobs...</p>
  <table id="jobs-table" hidden>
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Status</th>
        <th>Priority</th><th>Submitted</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="jobs-body"></tbody>
  </table>
</div>
<script src="/static/js/dashboard.js?v=1"></script>
{{end}}
